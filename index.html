<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Odin Sign up Form</title>
</head>
<body>
    <div class="image-column">
        <img src="images/bg-image.jpg" alt="Fern Background Image" class="bg-image">
        <div class="logo-container">
            <img src="images/odin-logo.png" alt="Odin Logo" class="logo">
            <div class="odin-text">ODIN</div>
        </div>
    </div>
    <div class="sign-up-column">
        <div class="sign-up-texts">
            <p>
                This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.
            </p>
            <p>You <em>know</em> you want to.</p>
        </div>
        <div class="form-container">
            <form>
                <div class="form-content">
                    <p class="form-heading">
                        Let's do this!
                    </p>
                    <div class="form-fields">
                        <div class="input-container">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="first_name" placeholder="Thor">
                        </div>
                        <div class="input-container">
                            <label for="last_name">LAST NAME</label>
                            <input type="text" id="last_name" name="last_name" placeholder="Odinson">
                        </div>
                        <div class="input-container">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" placeholder="name@example.com">
                        </div>
                        <div class="input-container">
                            <label for="phone_number">PHONE NUMBER</label>
                            <input type="tel" id="phone_number" name="phone_number" placeholder="1234-5678-9012">
                        </div>
                        <div class="input-container">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div class="input-container">
                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm_password">
                        </div>
                    </div>
                </div>
                <div class="button-container">
                    <button type="submit" class="submit-button">Create Account</button>
                </div>
            </form>
        </div>
        <div class="log-in-text">Already have an account? <a href="#" class="log-in">Log in</a></div>
    </div>
</body>
</html>
